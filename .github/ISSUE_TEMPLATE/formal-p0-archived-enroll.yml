body:
  - type: markdown
    attributes:
      value: |
        **EN:** Copy the full bilingual body from [`.github/ISSUES/bodies/p0-block-enroll-archived.md`](https://github.com/maximusmakarov/qa-training-platform/blob/fix/formal-spec-alignment-p0-p1/.github/ISSUES/bodies/p0-block-enroll-archived.md) into the description below, or run `python scripts/create_formal_issues.py`.

        **RU:** Скопируйте тело issue из `.github/ISSUES/bodies/p0-block-enroll-archived.md` или выполните `python scripts/create_formal_issues.py`.

  - type: textarea
    id: body
    attributes:
      label: "Issue body / Тело issue (paste from bodies/*.md)"
      description: "Full EN+RU template with acceptance criteria"
      placeholder: "Paste content from .github/ISSUES/bodies/p0-block-enroll-archived.md"
