      required: true

  - type: checkboxes
    id: acceptance
    attributes:
      label: "Acceptance criteria / Критерии приёмки"
      options:
        - label: "POST enroll on ARCHIVED → 409 / Запись на ARCHIVED → 409"
          required: true
        - label: "pytest test_enroll_archived_course_conflict passes"
          required: true
        - label: "Formal oracle rejects ARCHIVED enroll"
