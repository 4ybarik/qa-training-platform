# Резервный CI поверх локального Jenkins: гоняет те же проверки, что и
# `make test-quality` (ruff + pytest с coverage gate), на каждый push в main
# и pull request. Jenkins остаётся основным контуром (Allure, e2e, mutation
# score) — этот workflow гарантирует быстрый фидбек прямо на GitHub.
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tests with coverage gate
        env:
          DATABASE_URL: "sqlite:///./ci.db"
          ENVIRONMENT: development
          SECRET_KEY: ci-secret-at-least-32-bytes-long!
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70

