services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qatp
      POSTGRES_PASSWORD: qatp
      POSTGRES_DB: qatp
    # Порты на хост НЕ пробрасываются здесь намеренно — см. docker-compose.override.yml.
    # Compose подключает override-файл автоматически при обычном `docker compose up`
    # (без явного -f), поэтому для повседневной разработки порты всё равно будут
    # доступны на localhost. А Jenkinsfile явно указывает -f docker-compose.yml,
    # из-за чего override НЕ подключается, и CI-копия db не конфликтует портом
    # с уже запущенным локально основным стеком.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating", "--verbose"]
    volumes:
      # При запуске из Jenkins Docker CLI обращается к демону хоста через
      # docker.sock. Поэтому относительный ./wiremock превращается в
      # /workspace/wiremock (путь только внутри контейнера Jenkins) и
      # Docker Desktop отклоняет такой mount. HOST_PROJECT_DIR задаётся
      # docker-compose для Jenkins; локально сохраняется fallback на .
      - ${HOST_PROJECT_DIR:-.}/wiremock:/home/wiremock:ro

  app:
    build:
      context: ./backend
      args:
        # ${APP_VERSION:-...} — если переменная APP_VERSION не задана в шелле
        # перед запуском docker compose, используется дефолт "0.0.0-dev".
        # Чтобы версия реально подставлялась из Git, экспортируйте переменную
        # перед сборкой, например:
        #   export APP_VERSION=$(git describe --tags --always --dirty)
        #   docker compose up -d --build
        # Или одной строкой: APP_VERSION=$(git describe --tags --always --dirty) docker compose up -d --build
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    environment:
      DATABASE_URL: postgresql+psycopg://qatp:qatp@db:5432/qatp
      ENVIRONMENT: development        # запускает seed на старте
      SECRET_KEY: dev-secret-change-me
      TEST_SUPPORT_KEY: ${TEST_SUPPORT_KEY:-local-test-support-key}
      ALLOW_TEST_MUTATIONS: "true"
      REDIS_URL: redis://redis:6379/0
      EXTERNAL_SERVICE_URL: http://wiremock:8080
    # Порты на хост — см. комментарий у db выше, та же логика.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      wiremock:
        condition: service_started
    volumes:
      # Аватары не теряются при пересоздании контейнера приложения.
      - avatar_uploads:/app/app/static/uploads/avatars
      - quality_history:/app/quality-history
    # Приложение отвечает на /health — используем это как признак готовности
    # контейнера (docker compose ps / docker compose up --wait).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      default:
        # Dotted host is accepted consistently by Firefox/WebKit for
        # host-only cookies; the single-label service name is still retained
        # for API clients and backwards compatibility.
        aliases:
          - app.test

  worker:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    command: ["rq", "worker", "qa-training", "--url", "redis://redis:6379/0"]
    environment:
      DATABASE_URL: postgresql+psycopg://qatp:qatp@db:5432/qatp
      ENVIRONMENT: development
      SECRET_KEY: dev-secret-change-me
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # ---------- CI/CD: Jenkins + Allure ----------
  # Jenkins оркестрирует пайплайн (см. Jenkinsfile в корне репозитория):
  # checkout -> сборка app -> pytest (API) -> Playwright (E2E) -> allure-результаты
  # -> публикация в Allure-сервис ниже.
  jenkins:
    # Собирается из ./jenkins/Dockerfile — это официальный образ Jenkins
    # ПЛЮС предустановленный Docker CLI (docker compose, docker run).
    # Без этого доступ к docker.sock есть, а самой программы `docker` внутри
    # контейнера нет — пайплайн падает с "docker: not found".
    build: ./jenkins
    # Установка плагинов завершает JVM через safe-restart. Без политики
    # рестарта контейнер остаётся остановленным и Jenkins недоступен.
    restart: unless-stopped
    user: root  # упрощает доступ к docker.sock независимо от GID хостовой группы docker
    ports:
      - "127.0.0.1:8080:8080"   # веб-интерфейс Jenkins, только локальный доступ
      - "127.0.0.1:50000:50000"  # агентский порт, только локальный доступ
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # доступ к Docker хоста (Docker-outside-of-Docker)
      - ./:/workspace  # репозиторий проекта виден джобе для checkout без git-сервера
      - allure_results:/workspace/allure-results
      - quality_history:/quality-history
      # Скрипт задаёт Jenkins URL и включает локальную аутентификацию, если
      # JENKINS_ADMIN_PASSWORD задан во внешнем .env.
      - ./jenkins/init.groovy.d/01-local-security.groovy:/var/jenkins_home/init.groovy.d/01-local-security.groovy:ro
      - ./jenkins/init.groovy.d/02-locale-timezone.groovy:/var/jenkins_home/init.groovy.d/02-locale-timezone.groovy:ro
    environment:
      # Keep Jenkins UI and build timestamps aligned with the user's Moscow
      # environment. Locale plugin settings below additionally force Russian
      # UI instead of depending on the browser Accept-Language header.
      TZ: "${TZ:-Europe/Moscow}"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Duser.timezone=${TZ:-Europe/Moscow} -Duser.language=ru -Duser.country=RU"
      JENKINS_URL: "${JENKINS_URL:-http://127.0.0.1:8080/}"
      JENKINS_ADMIN_ID: "${JENKINS_ADMIN_ID:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:-}"
      # ВАЖНО для Docker-outside-of-Docker: путь /workspace существует только
      # ВНУТРИ контейнера Jenkins. Когда Jenkins запускает ДОЧЕРНИЙ контейнер
      # через docker run/docker compose run (используя проброшенный docker.sock
      # хоста), демон Docker монтирует volumes относительно РЕАЛЬНОЙ файловой
      # системы хоста — он понятия не имеет, что такое "/workspace". Поэтому
      # для volumes в дочерних контейнерах нужен путь на хосте, а не внутри
      # Jenkins. ${PWD} — это абсолютный путь на хосте в момент запуска
      # `docker compose up` (подставляется самим Compose при чтении файла).
      HOST_PROJECT_DIR: "${PWD}"

  # Принимает allure-results (JSON от pytest/Playwright) и рендерит HTML-отчёт.
  # Документация образа: https://github.com/fescobar/allure-docker-service
  allure:
    image: frankescobar/allure-docker-service:2.27.0
    environment:
      CHECK_RESULTS_EVERY_SECONDS: "5"
      KEEP_HISTORY: "20"
    ports:
      - "5050:5050"   # Allure REST API + веб-отчёт
    volumes:
      - allure_results:/app/allure-results
      - allure_reports:/app/default-reports

volumes:
  pgdata:
  avatar_uploads:
  jenkins_home:
  allure_results:
  allure_reports:
  quality_history:
    # История качества должна переживать пересоздание CI-стека. Jenkins
    # использует уникальное имя Compose-проекта на каждую сборку, поэтому
    # без фиксированного имени каждая сборка получила бы собственную пустую
    # историю.
    name: qa-training-platform_quality_history
