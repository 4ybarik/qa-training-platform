[pytest]
testpaths = api integration contract ui
python_files = test_*.py
python_functions = test_*
# Every learner test has a finite deadline in local IDE and Jenkins.
addopts = -ra --strict-markers --timeout=60
markers =
    api: HTTP API tests
    ui: browser tests powered by Playwright
    integration: tests involving more than one component
    contract: API schema and compatibility tests
    security: authentication, authorization, and input security tests
    reliability: retries, timeouts, isolation, and failure-mode tests
